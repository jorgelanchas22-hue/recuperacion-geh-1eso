<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperación GeH 1.º ESO · Salesianos Triana</title>
  <style>
    html,body{height:100%;margin:0;background:#f1f5f9;overflow:hidden}
    #app{width:100%;height:100%;border:0;display:block;background:white}
    .fallback{font-family:Arial,sans-serif;padding:2rem}
  </style>
</head>
<body>
  <iframe id="app" src="app-original.html" title="Recuperación de Geografía e Historia"></iframe>
  <noscript><div class="fallback"><a href="app-original.html">Abrir la aplicación</a></div></noscript>

  <script>
  (() => {
    const MAPS = {
      map_and_phys: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Andalusia_blank_map.svg',
      map_and_pol:  'https://commons.wikimedia.org/wiki/Special:Redirect/file/Andalusia_blank_map.svg',
      map_esp_phys: 'assets/mapa_mudo_espana.png',
      map_esp_pol:  'assets/mapa_mudo_espana.png',
      map_eur_phys: 'assets/mapa_mudo_europa.png',
      map_eur_pol:  'assets/mapa_mudo_europa.png',
      map_world_phys:'assets/mapa_mudo_mundo.png',
      map_world_pol: 'assets/mapa_mudo_mundo.png'
    };

    const frame = document.getElementById('app');
    let observer = null;

    function addStyles(doc) {
      if (doc.getElementById('maps-enhanced-style')) return;
      const style = doc.createElement('style');
      style.id = 'maps-enhanced-style';
      style.textContent = `
        .map-sheet-enhanced{background:#fff;border:2px solid #cbd5e1;border-radius:18px;padding:14px;margin:18px 0;box-shadow:inset 0 0 0 1px #f8fafc}
        .map-sheet-enhanced__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
        .map-sheet-enhanced__title{font-size:13px;font-weight:800;color:#0f172a}
        .map-sheet-enhanced__subtitle{font-size:11px;color:#64748b;margin-top:2px}
        .map-sheet-enhanced__link{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:12px;background:#0284c7;color:white!important;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}
        .map-sheet-enhanced__canvas{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:10px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .map-sheet-enhanced__canvas img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:white;filter:grayscale(1) contrast(1.15)}
        .map-sheet-enhanced__fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:11px;color:#475569}
        .map-sheet-enhanced__field{border:1px solid #e2e8f0;border-radius:12px;padding:9px}
        .map-sheet-enhanced__credit{font-size:10px;color:#94a3b8;margin-top:7px}
        @media (max-width:640px){.map-sheet-enhanced__head{align-items:flex-start;flex-direction:column}.map-sheet-enhanced__fields{grid-template-columns:1fr}.map-sheet-enhanced__canvas{min-height:220px;padding:6px}}
        @media print{
          .map-sheet-enhanced{break-inside:avoid;page-break-inside:avoid;border:1px solid #888!important;box-shadow:none!important}
          .map-sheet-enhanced__head,.map-sheet-enhanced__credit{display:none!important}
          .map-sheet-enhanced__canvas{min-height:0;border:0;padding:0}
          .map-sheet-enhanced__canvas img{max-height:17cm!important;width:100%!important;object-fit:contain!important;filter:grayscale(1) contrast(1.2)!important}
        }
      `;
      doc.head.appendChild(style);
    }

    function enhanceMaps() {
      let doc;
      try { doc = frame.contentDocument; } catch (e) { return; }
      if (!doc || !doc.head) return;
      addStyles(doc);

      const root = doc.getElementById('map-activities');
      if (!root) {
        setTimeout(enhanceMaps, 350);
        return;
      }

      root.querySelectorAll('article').forEach(article => {
        const textarea = article.querySelector('textarea[id^="task-map_"]');
        if (!textarea) return;
        const id = textarea.id.replace(/^task-/, '');
        const src = MAPS[id];
        if (!src || article.querySelector(`[data-enhanced-map="${id}"]`)) return;

        const heading = article.querySelector('h3');
        const title = heading ? heading.textContent.trim() : 'Mapa mudo';
        const block = doc.createElement('div');
        block.className = 'map-sheet-enhanced';
        block.setAttribute('data-enhanced-map', id);
        const credit = id.startsWith('map_and_')
          ? '<div class="map-sheet-enhanced__credit">Mapa base de Andalucía: Wikimedia Commons (CC BY-SA 3.0).</div>'
          : '';

        block.innerHTML = `
          <div class="map-sheet-enhanced__head no-print">
            <div>
              <div class="map-sheet-enhanced__title">🗺️ Mapa mudo para trabajar</div>
              <div class="map-sheet-enhanced__subtitle">Versión visual equivalente al cuadernillo imprimible.</div>
            </div>
            <a class="map-sheet-enhanced__link" href="${src}" target="_blank" rel="noopener">Ver mapa grande ↗</a>
          </div>
          <div class="map-sheet-enhanced__canvas">
            <img src="${src}" alt="${title}" loading="lazy">
          </div>
          ${credit}
          <div class="map-sheet-enhanced__fields">
            <div class="map-sheet-enhanced__field"><strong>Título:</strong> _______________________________________</div>
            <div class="map-sheet-enhanced__field"><strong>Leyenda / símbolos:</strong> ___________________________</div>
          </div>
        `;
        textarea.parentNode.insertBefore(block, textarea);
      });

      if (!observer) {
        observer = new MutationObserver(() => enhanceMaps());
        observer.observe(root, {childList:true, subtree:true});
      }
    }

    frame.addEventListener('load', () => {
      enhanceMaps();
      setTimeout(enhanceMaps, 700);
      setTimeout(enhanceMaps, 1500);
    });
  })();
  </script>
</body>
</html>
