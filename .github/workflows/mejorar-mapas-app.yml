name: Clarificar acceso del alumnado

on:
  push:
    paths:
      - '.github/workflows/mejorar-mapas-app.yml'

permissions:
  contents: write

jobs:
  clarificar-acceso:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Eliminar referencia a modo demo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app-original.html')
          text = path.read_text(encoding='utf-8')
          old = 'Modo Invitado / Demo'
          new = 'Selecciona tu nombre'
          if old not in text:
              print('La etiqueta antigua ya no aparece.')
          else:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print('Etiqueta actualizada correctamente.')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-original.html
          git commit -m "Clarificar selección de alumno"
          git push
