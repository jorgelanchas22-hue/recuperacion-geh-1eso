name: Mejorar mapas de la app

on:
  push:
    paths:
      - '.github/workflows/mejorar-mapas-app.yml'

permissions:
  contents: write

jobs:
  mejorar-mapas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Insertar mapas imprimibles en las actividades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          helper_marker = 'MAPAS_IMPRIMIBLES_V2'
          if helper_marker not in text:
              marker = '        // ACTIVIDADES DE MAPAS (generadas dinámicamente)'
              if marker not in text:
                  raise SystemExit('No se encontró el bloque de actividades de mapas.')

              helper = r'''        // MAPAS_IMPRIMIBLES_V2
        // Usa en la app los mismos mapas mudos limpios preparados para el cuadernillo impreso.
        const MAP_IMAGE_BY_ID = {
            map_and_phys: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Andalusia_blank_map.svg',
            map_and_pol:  'https://commons.wikimedia.org/wiki/Special:Redirect/file/Andalusia_blank_map.svg',
            map_esp_phys: 'assets/mapa_mudo_espana.png',
            map_esp_pol:  'assets/mapa_mudo_espana.png',
            map_eur_phys: 'assets/mapa_mudo_europa.png',
            map_eur_pol:  'assets/mapa_mudo_europa.png',
            map_world_phys:'assets/mapa_mudo_mundo.png',
            map_world_pol: 'assets/mapa_mudo_mundo.png'
        };

        function renderMapSheet(t) {
            const src = MAP_IMAGE_BY_ID[t.id];
            if (!src) return '';
            const isAndalusia = t.id.startsWith('map_and_');
            const sourceNote = isAndalusia
                ? '<p class="mt-2 text-[10px] text-slate-400 no-print">Mapa base de Andalucía: Wikimedia Commons, CC BY-SA.</p>'
                : '';
            return `
                <div class="map-sheet bg-white border-2 border-slate-300 rounded-2xl p-3 sm:p-5 shadow-inner">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3 no-print">
                        <div>
                            <p class="text-xs font-extrabold text-slate-800">🗺️ Mapa mudo para trabajar</p>
                            <p class="text-[11px] text-slate-500">Amplía la imagen si lo necesitas y completa sobre tu cuaderno o en la versión impresa.</p>
                        </div>
                        <a href="${src}" target="_blank" rel="noopener" class="inline-flex items-center justify-center px-3 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold transition-colors">Ver mapa grande ↗</a>
                    </div>
                    <div class="bg-white rounded-xl border border-slate-200 p-2 sm:p-4 min-h-[260px] sm:min-h-[390px] flex items-center justify-center overflow-hidden">
                        <img src="${src}" alt="${t.title}" loading="lazy" class="block w-full h-auto max-h-[620px] object-contain mix-blend-multiply" style="filter: grayscale(1) contrast(1.15);" />
                    </div>
                    ${sourceNote}
                    <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px] text-slate-600">
                        <div class="border border-slate-200 rounded-xl p-2.5"><strong>Título:</strong> _______________________________________</div>
                        <div class="border border-slate-200 rounded-xl p-2.5"><strong>Leyenda / símbolos:</strong> ___________________________</div>
                    </div>
                </div>`;
        }
'''
              text = text.replace(marker, helper + '\n' + marker, 1)

          injection_marker = '${renderMapSheet(t)}'
          if injection_marker not in text:
              needle = '                    <textarea id="task-${t.id}" placeholder="Escribe los elementos localizados y qué debes corregir..."'
              if needle not in text:
                  raise SystemExit('No se encontró el cuadro de respuesta de los mapas.')
              text = text.replace(needle, '                    ${renderMapSheet(t)}\n' + needle, 1)

          # Mejora específica de impresión para que el mapa ocupe la página sin cortarse.
          print_marker = '.print-only { display: none; }'
          print_css = r'''
        .map-sheet img { background: #fff; }
        @media print {
            .map-sheet { break-inside: avoid; page-break-inside: avoid; border: 1px solid #999 !important; box-shadow: none !important; }
            .map-sheet img { max-height: 17cm !important; width: 100% !important; object-fit: contain !important; }
        }
'''
          if '.map-sheet img { background: #fff; }' not in text and print_marker in text:
              text = text.replace(print_marker, print_marker + print_css, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mejorar mapas en la app de recuperación"
          git push
