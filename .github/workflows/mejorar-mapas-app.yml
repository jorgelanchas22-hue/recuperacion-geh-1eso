name: Mejorar lectura de apuntes

on:
  push:
    paths:
      - '.github/workflows/mejorar-mapas-app.yml'

permissions:
  contents: write

jobs:
  mejorar-apuntes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Convertir apuntes en vista de lectura
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* APUNTES_LECTURA_V3 */'
          css = r'''
/* APUNTES_LECTURA_V3 */
#notes{padding:28px 18px 56px;background:#f3f6fa;color:#172033}
.notes-wrap{max-width:920px;margin:0 auto}
.notes-hero{padding:30px 32px;border-radius:24px;margin-bottom:20px;box-shadow:0 12px 30px rgba(15,23,42,.14)}
.notes-hero h1{font-size:clamp(30px,4vw,42px);line-height:1.12;margin:8px 0 12px}
.notes-hero p{font-size:17px;line-height:1.7;max-width:780px}
.study-tabs{position:sticky;top:0;z-index:10;background:rgba(243,246,250,.96);backdrop-filter:blur(8px);padding:12px 0 14px;margin:0 0 18px;border-bottom:1px solid #dbe3ee}
.study-tab{font-size:14px;padding:11px 15px}
.grid{grid-template-columns:1fr!important;gap:18px}
.card{padding:24px 26px;border-radius:20px;box-shadow:0 8px 24px rgba(15,23,42,.07)}
.card h3{font-size:24px;line-height:1.25;margin:2px 0 12px;color:#172033}
.card h4{font-size:18px;margin:18px 0 8px}
.card p,.card li{font-size:16.5px;line-height:1.78;color:#334155}
.card ul{padding-left:22px}
.tag{font-size:11px;padding:6px 10px;margin-bottom:8px}
.key,.remember{font-size:15px;line-height:1.65;padding:13px 15px;margin-top:14px}
.timeline{gap:10px;margin-top:12px}
.time{font-size:14px;padding:9px 12px}
.mapimg{max-height:480px;padding:12px}
#study-geo::before,#study-pre::before,#study-ant::before{display:block;font-weight:900;font-size:28px;line-height:1.2;margin:6px 0 18px;color:#0f172a}
#study-geo::before{content:'1. Geografía física'}
#study-pre::before{content:'2. Prehistoria'}
#study-ant::before{content:'3. Mundo Antiguo'}
.footer-note{font-size:15px;line-height:1.65;padding:16px 18px}
@media(max-width:640px){#notes{padding:16px 10px 40px}.notes-hero{padding:22px 18px}.notes-hero p{font-size:16px}.card{padding:19px 17px}.card h3{font-size:21px}.card p,.card li{font-size:16px}.study-tabs{gap:6px}.study-tab{flex:1;min-width:140px}}
@media print{#notes{padding:0}.notes-wrap{max-width:none}.card p,.card li{font-size:12pt;line-height:1.55}.card h3{font-size:17pt}.key,.remember{font-size:11.5pt}.study-section{page-break-before:auto!important}.card{box-shadow:none}}
'''

          if marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)
          else:
              print('La mejora de lectura ya estaba aplicada.')

          old = 'Estos apuntes no sustituyen al libro: resumen lo esencial para que puedas comprender, practicar y demostrar lo aprendido.'
          new = 'Aquí tienes lo esencial para estudiar cada bloque con calma. Lee un apartado, comprende las ideas clave y después pasa a su actividad correspondiente.'
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mejorar vista de lectura de apuntes"
          git push
